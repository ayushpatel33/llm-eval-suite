name: tests

on:
  push:
  pull_request:

jobs:
  replay-tests:
    runs-on: ubuntu-latest
    env:
      OFFLINE: "1"
      GEMINI_MODEL: gemini-3.1-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v